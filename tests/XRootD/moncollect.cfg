set name = moncollect
set port = 8095

# Send the detailed f-stream (with lfn/ops, the in-flight xfr snapshot, and the
# new terminal-error records for failed opens / failed closes) to the collector
# that setup_moncollect starts on UDP port 8096. Short intervals keep the test
# fast; "auth" enriches the user dictionary with the auth method and VO. This
# must precede the "continue" below, which does not return to this file.
xrootd.monitor all flush 2s ident 2s fstat 2s lfn ops xfr 1 auth dest fstat info user io localhost:8096

set src = $SOURCE_DIR

# Security fragment generated by setup_moncollect (moncollect.sh): when the VOMS
# plug-in is built it enables gsi auth with VOMS extraction so the VO surfaces on
# the monitoring stream; otherwise it is a no-op that just continues to
# common.cfg. continue does not return, so this must be the last directive here.
# (The env var has no underscore: inline $var substitution stops at non-alnum, so
# it is brought in via set before being used by continue.)
set seccfg = $MONCOLLECTSEC
continue $seccfg
