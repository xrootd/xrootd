set name = httpsredirect
set port = 7098

set pwd = $PWD
set src = $SOURCE_DIR

xrd.protocol XrdHttp:$port libXrdHttp.so

http.tlsclientauth off
xrd.tlsca certfile $pwd/../tls/ca.pem
xrd.tls $pwd/../tls/host.pem $pwd/../tls/host.key

http.secretkey 0123456789abcdef0123456789abcdef
http.selfhttps2http yes

continue $src/common.cfg
