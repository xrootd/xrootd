set name = shovel
set port = 8191

# Send the detailed f-stream to the local xrdmoncollect running in shoveler
# mode on UDP port 8192 (started by shovel.sh); it relays the datagrams over
# TCP to a central TCP-only collector on port 8193. Short intervals keep the
# test fast. This must precede the "continue" below, which does not return.
xrootd.monitor all flush 2s ident 2s fstat 2s lfn ops xfr 1 auth dest fstat info user io localhost:8192

set src = $SOURCE_DIR
continue $src/common.cfg
