set name = jwt
set port = 7114

set pwd = $PWD
set src = $SOURCE_DIR

xrootd.seclib libXrdSec.so
xrd.protocol XrdHttp:7114 libXrdHttp.so

# Certs are generated by jwt.sh into this directory before the server starts.
xrd.tlsca certfile $pwd/jwt/ca/tlsca.pem
xrd.tls $pwd/jwt/ca/tls.crt $pwd/jwt/ca/tls.key
http.tlsclientauth off

# http.jwt reads Authorization directly. optional: a request with no token
# stays anonymous and acc.authdb denies it. A bad token is rejected by the plugin.
http.jwt on

ofs.authorize 1
acc.authdb $src/jwt.authdb

# The SciTokens INI is written by jwt.sh. The issuer it names is a second
# xrootd, already listening, because this plugin fetches JWKS during init.
sec.protparm jwt -scitokens-config $pwd/jwt/scitokens.cfg
sec.protocol jwt
sec.protbind * only jwt

continue $src/common.cfg
