# Snippet: the digital library (the paths /=/), for the user of the test with
# sss, configured by diglib.conf next to the run directory, which the server
# also publishes as an extra configuration file.

sec.protocol sss -c $rundir/../diglib.keytab -s $rundir/../diglib.keytab -g
sec.protbind * only sss unix

xrootd.diglib * $rundir/../diglib.conf
dig.log deny grant
dig.addconf $rundir/../diglib.conf diglib.conf
