# Snippet: the gsi protocol only, with the shared credentials, a check of the
# CRL and signed requests, which need the session key that gsi provides. The
# authorization database allows everything to the user "client" of the
# gridmap.

sec.protparm gsi -ca:verify -certdir:$creds
sec.protparm gsi -crl:require -crldir:$creds
sec.protparm gsi -key:$creds/host.key
sec.protparm gsi -cert:$creds/host.pem
sec.protparm gsi -gridmap:$creds/gridmap
sec.protparm gsi -gmapopt:trymap,usedn
sec.protparm gsi -dlgpxy:request -exppxy:=creds
sec.protparm gsi -md:sha512:sha256:md5
sec.protparm gsi -d:1 -trustdns:false
sec.protocol gsi
sec.protbind * only gsi

sec.level all standard

ofs.authorize 1
acc.authdb $testdir/gsi.authdb
