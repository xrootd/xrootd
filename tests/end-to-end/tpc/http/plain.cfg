set run  = $BATS_TEST_TMPDIR
set name = $NAME
set port = $PORT

all.export /
all.adminpath $run/$name
all.pidpath   $run/$name
oss.localroot $run/$name

xrootd.trace all

tpc.allow local

xrd.protocol XrdHttp:$port libXrdHttp.so
http.exthandler xrdtpc +notls libXrdHttpTPC.so

all.sitename $name

xrd.port $port

all.trace    all
auth.trace   all
http.trace   all
ofs.trace    all
oss.trace    all
pss.trace    all
sec.trace    all
macaroons.trace all
scitokens.trace all
