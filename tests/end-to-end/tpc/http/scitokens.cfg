set name = $NAME
set port = $PORT
set file = $BATS_FILE_TMPDIR
set run  = $BATS_TEST_TMPDIR
set src  = $BATS_TEST_DIRNAME

all.export /
all.adminpath $run/$name
all.pidpath   $run/$name
oss.localroot $run/$name

xrootd.trace all

tpc.allow local

xrootd.seclib libXrdSec.so
xrd.protocol XrdHttp:$port libXrdHttp.so

http.exthandler xrdtpc libXrdHttpTPC.so

xrd.tls $file/host.pem $file/host.key
xrd.tlsca certfile $file/ca.pem

http.header2cgi Authorization authz strip-on-redirect

ofs.authlib ++ libXrdAccSciTokens.so config=$src/scitokens-module.cfg
ofs.authorize true

acc.authdb $src/scitokens.authdb

all.sitename $name

xrd.port $port

all.trace    all
auth.trace   all
http.trace   all
ofs.trace    all
oss.trace    all
pss.trace    all
sec.trace    all
macaroons.trace all
scitokens.trace all
