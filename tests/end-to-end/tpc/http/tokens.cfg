# Snippet: authorization with the tokens of the test issuer, which the test
# starts with start_issuer, with the SciTokens library as the only library
# of authorization (no "++"), and the authorization database of the setup.

http.header2cgi Authorization authz strip-on-redirect

ofs.authlib libXrdAccSciTokens.so config=$rundir/../scitokens.conf
ofs.authorize true
acc.authdb $setupdir/scitokens.authdb
