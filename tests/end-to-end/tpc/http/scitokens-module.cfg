[Global]

audience = https://localhost:8538/, https://localhost:8539/
onmissing = passthrough

[Issuer src]
issuer = https://localhost:8538/
base_path = /
default_user = nobody
authorization_strategy = capability

[Issuer dst]
issuer = https://localhost:8539/
base_path = /
default_user = nobody
authorization_strategy = capability
