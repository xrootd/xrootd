set name  = $NAME
set port  = $PORT
set file  = $BATS_FILE_TMPDIR
set run   = $BATS_TEST_TMPDIR
set src   = $BATS_TEST_DIRNAME
set suite = $BATS_SUITE_TMPDIR

all.export /
all.adminpath $run/$name
all.pidpath   $run/$name
oss.localroot $run/$name

tpc.allow local

xrootd.seclib libXrdSec.so

xrd.protocol XrdHttp:$port libXrdHttp.so

xrd.tls $suite/host.pem $suite/host.key
xrd.tlsca certfile $suite/ca.pem

http.exthandler xrdtpc libXrdHttpTPC.so
http.exthandler xrdmacaroons libXrdMacaroons.so
http.header2cgi Authorization authz strip-on-redirect
http.gridmap $src/macaroon.gridmap

ofs.authlib libXrdMacaroons.so
macaroons.secretkey $run/macaroon-secret

ofs.authorize true

acc.authdb $src/macaroon.authdb

all.sitename $name

xrd.port $port

auth.trace   all
http.trace   all
oss.trace    all
pss.trace    all
sec.trace    all
macaroons.trace all
scitokens.trace all
