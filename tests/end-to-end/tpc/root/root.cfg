set run  = $BATS_TEST_TMPDIR
set name = $NAME
set port = $PORT
set src  = $BATS_TEST_DIRNAME

all.export /
all.adminpath $run/$name
all.pidpath   $run/$name
oss.localroot $run/$name

ofs.tpc pgm $src/../../../../build/bin/xrdcp --server

all.sitename $name

xrd.port $port

all.trace    all
auth.trace   all
ofs.trace    all
oss.trace    all
pss.trace    all
sec.trace    all
xrootd.trace all
