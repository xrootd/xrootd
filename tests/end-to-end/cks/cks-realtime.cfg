set name = cks-realtime
set port = 11968
set test = $BATS_TEST_TMPDIR

all.adminpath $test/$name
all.export /
all.pidpath $test/$name
oss.localroot $test/$name

# Compute the digest while the file is written. The client selects the
# digest with the cks.type CGI element, which chkcgi enables.

xrootd.chksum adler32 crc32 crc32c md5 chkcgi
ofs.cksrt auto default chkcgi

xrd.port $port
