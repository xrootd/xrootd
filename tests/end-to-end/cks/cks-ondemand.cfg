set name = cks-ondemand
set port = 11967
set test = $BATS_TEST_TMPDIR

all.adminpath $test/$name
all.export /
all.pidpath $test/$name
oss.localroot $test/$name

# Compute every digest on demand, and let the client select one with
# the cks.type CGI element.

xrootd.chksum adler32 crc32 crc32c md5 chkcgi

xrd.port $port
