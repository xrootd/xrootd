set name = mirage
set port = 6543

# temporary directory where the test run
set test = $BATS_TEST_TMPDIR

# directory where mirage.bats is located
set dir  = $BATS_TEST_DIRNAME

ofs.osslib libXrdOssMirage.so
ofs.xattrlib libXrdOssMirage.so

all.sitename $name
all.export /
all.adminpath $test/$name
all.pidpath   $test/$name
oss.localroot $test/$name

xrd.maxfd strict 1k
xrd.port $port

all.trace    all
ofs.trace    all
oss.trace    all
