set name = mirage
set port = 6543

# temporary directory where the test run
set test = $BATS_TEST_TMPDIR

ofs.osslib   ++ libXrdOssMirage.so /mirage_test/
ofs.xattrlib ++ libXrdOssMirage.so /mirage_test/

all.sitename $name
all.export /
all.adminpath $test/$name
all.pidpath   $test/$name
oss.localroot $test/$name

xrd.port $port

all.trace    all
ofs.trace    all
oss.trace    all
