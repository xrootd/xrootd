# Snippet: the server redirects chmod to a host which does not resolve. With
# dyndns, the server accepts a target which does not resolve at startup, but
# only when the resolver reports an unknown name (EAI_NONAME). RFC 6761
# reserves the domain .invalid, thus each resolver reports an unknown name,
# if it can reach a name server (see start_unknown in redirect.bats).
# A resolver can report a name of .localdomain as a name without an address
# (EAI_NODATA), and the server then refuses the configuration.

xrd.network dyndns
xrootd.redirect nosuchhost.invalid.:1094 chmod
