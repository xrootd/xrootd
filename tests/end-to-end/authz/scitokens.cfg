# Snippet: ztn as the only protocol of root://, and authorization by tokens of
# the test issuer below /protected, with the module configuration and the
# authorization database which the test writes next to the run directory.

sec.protocol ztn
sec.protbind * only ztn

http.header2cgi Authorization authz strip-on-redirect

ofs.authlib ++ libXrdAccSciTokens.so config=$rundir/../protected.conf
ofs.authorize 1
acc.authdb $rundir/../protected.authdb
