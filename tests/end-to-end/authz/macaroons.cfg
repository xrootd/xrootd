# Snippet: authorization by macaroons, and by the authorization database of
# this directory for requests without a macaroon. The user "client" of the
# gridmap may do everything in /rw, and anybody may read and list.

sec.protparm gsi -ca:verify -certdir:$creds
sec.protparm gsi -key:$creds/host.key
sec.protparm gsi -cert:$creds/host.pem
sec.protparm gsi -gridmap:$creds/gridmap
sec.protparm gsi -gmapopt:trymap,usedn
sec.protocol gsi
sec.protocol ztn
sec.protbind * only gsi ztn

http.gridmap $creds/gridmap

macaroons.onmissing passthrough

ofs.authorize
acc.authdb $testdir/macaroons.authdb
