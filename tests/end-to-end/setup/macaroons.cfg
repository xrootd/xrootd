# Snippet: macaroons with the shared secret, which the endpoint /.oauth2/token
# issues over HTTPS. Use it together with the snippets http.cfg and tls.cfg.

http.exthandler xrdmacaroons libXrdMacaroons.so
http.header2cgi Authorization authz strip-on-redirect

ofs.authlib libXrdMacaroons.so
macaroons.secretkey $creds/macaroon.secret
