# OpenSSL configuration of the credentials of the test suite (see
# credentials.sh), which sets CREDENTIALS_DIR and the host names in the
# environment.

[ ca ]
default_ca             = test_ca

[ test_ca ]
dir                    = $ENV::CREDENTIALS_DIR
database               = $dir/ca/db
new_certs_dir          = $dir/ca
certificate            = $dir/ca.pem
private_key            = $dir/ca.key
default_md             = sha256
default_days           = 30
default_crl_days       = 7
rand_serial            = yes
policy                 = policy_any
x509_extensions        = ca_ext
copy_extensions        = none
unique_subject         = no

[ policy_any ]
commonName             = supplied

[ req ]
default_bits           = 2048
default_md             = sha256
distinguished_name     = req_dn
prompt                 = no

[ req_dn ]
O                      = XRootD
CN                     = XRootD Test CA

[ ca_ext ]
basicConstraints       = critical, CA:true, pathlen:0
keyUsage               = critical, keyCertSign, cRLSign
subjectKeyIdentifier   = hash

[ host_ext ]
basicConstraints       = critical, CA:false
keyUsage               = critical, digitalSignature, keyEncipherment
extendedKeyUsage       = serverAuth, clientAuth
subjectKeyIdentifier   = hash
authorityKeyIdentifier = keyid, issuer
subjectAltName         = @host_names

[ client_ext ]
basicConstraints       = critical, CA:false
keyUsage               = critical, digitalSignature, keyEncipherment
extendedKeyUsage       = clientAuth
subjectKeyIdentifier   = hash
authorityKeyIdentifier = keyid, issuer

[ host_names ]
DNS.1                  = localhost
DNS.2                  = $ENV::CREDENTIALS_FQDN
DNS.3                  = $ENV::CREDENTIALS_HOST
IP.1                   = 127.0.0.1
IP.2                   = ::1
