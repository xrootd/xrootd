# Role: a data server, which exports its data directory. The clients must
# authenticate with unix, which needs no credentials and is the only protocol
# of the server. A snippet for another protocol adds the protocol and its
# own "sec.protbind * only <protocol>", as a second protbind for * fails.

all.export /
oss.localroot $rundir/data

# The checksums of a data server, with zcrc32 from its calculation library
ofs.ckslib zcrc32 libXrdCksCalczcrc32.so
xrootd.chksum adler32 crc32c zcrc32 md5 chkcgi

xrootd.seclib libXrdSec.so
sec.protocol unix

xrd.port $port
