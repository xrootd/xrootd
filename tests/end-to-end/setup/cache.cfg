# Role: a caching proxy (XCache) in front of the origin at $ORIGIN, a
# host:port which the test exports before start_server. The proxy file cache
# (XrdPfc) keeps the data and the .cinfo files in the data directory, in
# blocks of 128 KiB. Prefetch is off, thus a read fetches only the blocks
# which it touches. The clients and the origin use unix authentication.

set origin = $ORIGIN

all.export /
oss.localroot $rundir/data

# The checksums of the old cache tests, without a calculation library, as a
# snippet may load the checksum manager of the proxy instead
xrootd.chksum max 2 md5 adler32 crc32 crc32c

xrootd.seclib libXrdSec.so
sec.protocol unix

xrd.port $port

ofs.osslib libXrdPss.so
pss.cachelib libXrdPfc.so
pss.origin $origin

pfc.blocksize 128k
pfc.prefetch 0
pfc.trace debug
