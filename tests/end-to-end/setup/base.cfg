# Configuration common to every server of the end-to-end tests.
#
# start_server (see server.bash) writes this file first, then the role, then
# the extra snippets of the test, into a single configuration file. It sets
# the environment variables below for each server.

set name   = $SETUP_NAME
set rundir = $SETUP_RUNDIR
set admin  = $SETUP_ADMIN
set port   = $SETUP_PORT
set bindir = $SETUP_BINDIR

all.sitename  $name
all.adminpath $admin
all.pidpath   $rundir

ofs.chkpnt enable
ofs.ckslib zcrc32 libXrdCksCalczcrc32.so
ofs.osslib ++ libXrdOssTests.so
xrootd.chksum adler32 crc32c zcrc32 md5 chkcgi

xrd.maxfd strict 1k

all.trace    all
auth.trace   all
http.trace   all
ofs.trace    all
oss.trace    all
pss.trace    all
sec.trace    all
macaroons.trace all
scitokens.trace all
