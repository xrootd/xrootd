# Snippet: each node sends the g-stream of the HTTP requests and the summary
# report in JSON, with the plugins, to the collector at $MONITOR_PORT. An
# HTTP request waits at most 30 s for the redirector.

set monitor = $MONITOR_PORT
xrootd.mongstream http use flush 3s send json localhost:$monitor
xrd.report localhost:$monitor every 3 json plugins
http.maxdelay 30
