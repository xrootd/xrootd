# Snippet: the settings of the cluster management service (cmsd) of all
# nodes of a cluster. The short delays make the cluster form in a few seconds
# and make a lookup of a missing file fail in about one second.

cms.conwait 1
cms.delay startup 2 lookup 1 qdl 2 suspend 1
cms.space linger 0 recalc 15 min 2% 1g 5% 2g
cms.sched cpu 50 io 50 affinity randomized fuzz 50
xrd.network cache 5m nodnr norpipa

cms.trace all
xrd.trace all
