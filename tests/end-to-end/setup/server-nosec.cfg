# Role: a data server without security, which exports its data directory.
# Clients log in without authentication. Only the tests of such logins use it;
# other tests use the role "server".

all.export /
oss.localroot $rundir/data

# The checksums of a data server, with zcrc32 from its calculation library
ofs.ckslib zcrc32 libXrdCksCalczcrc32.so
xrootd.chksum adler32 crc32c zcrc32 md5 chkcgi

xrd.port $port
