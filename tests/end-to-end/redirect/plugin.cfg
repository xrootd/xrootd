# Snippet: redirects through the test redirect plugin.
#
# An open with tpc.key in its CGI makes the OFS redirect to localhost:9998,
# with sfsopq=sfsval as CGI of the target (ofs.tpc redirect). An HTTP COPY
# carries the CGI of its URL into the open, as does an open of the XRootD
# protocol. The redirect plugin (libXrdRedirTestPlugin) rewrites the target to
# rdlplugin-rewritten:9999. The OSS wrapper (libXrdOssUrlRedirTestPlugin)
# makes an open below /urlredir/ return a redirect to a URL, which the plugin
# rewrites to root://rdlplugin-rewritten-url:9997//destfile. Nothing listens
# on any of these targets; the tests only check the redirects.

http.desthttps false

ofs.tpc redirect localhost:9998 sfsopq=sfsval
xrootd.redirlib libXrdRedirTestPlugin.so
ofs.osslib ++ libXrdOssUrlRedirTestPlugin.so
