# Snippet: the HTTPS origin of the XrdClHttp tests. Its local root is the
# disk directory of the Tape REST API, below the directory $rundir/../tape
# which the test makes. The OSS stacks the statistics and a plugin which
# makes opens of slow_open.txt slow; the throttle wraps the file system.

oss.localroot $rundir/../tape/disk
http.exthandler xrdhttptapeapi libXrdHttpTapeApi.so $rundir/../tape

ofs.osslib ++ libXrdOssStats.so
ofs.osslib ++ $bindir/../lib/libXrdOssSlowOpen.so
xrootd.fslib ++ throttle

xrootd.chksum max 2 md5 adler32 crc32 crc32c
acc.audit deny grant
acc.authrefresh 300

# Clients of root:// need no authentication
sec.protbind * none
