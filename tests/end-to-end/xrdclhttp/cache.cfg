# Snippet: the HTTPS cache of the XrdClHttp tests, in front of the origin at
# $ORIGIN, an https:// URL, which the cache reads with XrdClHttp. The cache
# keeps the data and the .cinfo files in two spaces, which the test makes.

ofs.ckslib * libXrdPss.so
ofs.osslib ++ libXrdOssStats.so
xrootd.fslib ++ throttle
acc.audit deny grant

pfc.writequeue 16 4
pfc.ram 4g
pfc.diskusage 0.90 0.95 purgeinterval 300s
pfc.spaces data meta
oss.space data $rundir/../cache-spaces/data
oss.space meta $rundir/../cache-spaces/meta

pss.debug
pss.trace on
