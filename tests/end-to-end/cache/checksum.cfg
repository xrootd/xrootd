# Snippet: the cache keeps a checksum of each page of the files on its disk
# and checks it on each read from the disk. Blocks of 512 KiB, a prefetch of
# up to 8 blocks, and at most 1 GiB of memory, as in the old test. The cache
# is also a forwarding proxy ("="): a path can be the URL of a server, and a
# plain path goes to the origin.

pfc.cschk cache
pfc.blocksize 512k
pfc.prefetch 8
pfc.ram 1g

pss.origin = $origin
