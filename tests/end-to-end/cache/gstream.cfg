# Snippet: the cache sends the g-stream of XrdPfc, with a file_close record
# for each file which it closes, to the collector at $GSTREAM_PORT. The
# records carry b_todisk, the bytes which came from the origin.

set gstream = $GSTREAM_PORT
xrootd.mongstream pfc use flush 1s maxlen 24000 send json insthdr localhost:$gstream
