# Snippet: the cache keeps the data files in the space "data" and the .cinfo
# files in the space "meta". The path of a space does not end with its name,
# thus XrdOss adds a directory of that name. The test makes both directories
# before the start.

oss.space data $rundir/../spaces/space-data
oss.space meta $rundir/../spaces/space-meta
pfc.spaces data meta
