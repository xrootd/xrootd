# Snippet: with the disk below the low watermark, the purge of the cache starts
# above 4 MiB of files and removes the files which were read first, down to
# 4 MiB less the bytes written since the previous purge check, but not below
# 2 MiB. The purge runs each 60 s, which is the shortest interval. Above the
# watermarks the amount depends on the disk usage too, thus the watermarks are
# high.

pfc.diskusage 0.98 0.99 files 2m 3m 4m
