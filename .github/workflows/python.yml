name: Python

on:
  push:
    branches:
      - '**'
    paths:
      - setup.py
      - pyproject.toml
      - 'python/**'
      - .github/workflows/python.yml
  pull_request:
    paths:
      - setup.py
      - pyproject.toml
      - 'python/**'
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-coverage:
    name: Python contracts and coverage (${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            fsspec: 'fsspec==2024.2.0'
          - python: '3.13'
            fsspec: 'fsspec'
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - name: Install build and test dependencies
      env:
        FSSPEC_REQUIREMENT: ${{ matrix.fsspec }}
      run: |
        sudo apt-get update -q
        sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev \
          libxml2-dev zlib1g-dev uuid-dev libkrb5-dev libreadline-dev
        python -m pip install setuptools wheel pytest 'coverage>=7' \
          "$FSSPEC_REQUIREMENT"
    - name: Build server and bindings from this revision
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_PYTHON=ON -DENABLE_TESTS=OFF -DENABLE_HTTP=OFF \
          -DPython_EXECUTABLE="$(command -v python)"
        cmake --build build --parallel 2
    - name: Test Python contracts and enforce branch coverage
      env:
        PYTHONPATH: ${{ github.workspace }}/build/python/site-packages
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
        XROOTD: ${{ github.workspace }}/build/bin/xrootd
        XRDFS: ${{ github.workspace }}/build/bin/xrdfs
        COVERAGE_RCFILE: ${{ github.workspace }}/python/.coveragerc
      run: |
        python -m coverage run -m pytest -q python/tests
        python -m coverage xml -o python-coverage.xml
        python -m coverage html -d python-coverage-html
        # Each new interface module must meet the floor independently.
        for module in _asyncio aio asyncstream fsspec stream; do
          python -m coverage report --include="*/client/$module.py" \
            --fail-under=95
        done
    - name: Upload Python coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: python-coverage-${{ matrix.python }}
        path: |
          python-coverage.xml
          python-coverage-html
        if-no-files-found: warn

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Python build dependencies
      run: python -m pip install build

    - name: Build source distribution tarball
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        ./genversion.sh >| VERSION
        python -m build --sdist

    - name: Upload source distribution
      uses: actions/upload-artifact@v7
      with:
        name: python-sdist
        path: dist/*.tar.gz
        retention-days: 14

  manylinux:
    name: Python ${{ matrix.version }} (Linux, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runs_on }}
    container: ${{ matrix.platform.container }}
    needs: [ sdist ]

    permissions:
      contents: none

    strategy:
      fail-fast: false
      matrix:
        version: [ "3.9", "3.10", "3.11", "3.12", "3.13", "3.14" ]
        platform:
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - arch: x86_64
            runs_on: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64

    env:
      CMAKE_ARGS: -DCMAKE_BUILD_TYPE=Release
      PYTHON: python${{ matrix.version }}

    steps:
    - name: Install dependencies
      run: dnf install -y git krb5-devel libuuid-devel openssl-devel

    - name: Download source distribution
      uses: actions/download-artifact@v7
      with:
        name: python-sdist

    - name: Build binary wheel
      run: ${PYTHON} -m pip wheel --use-pep517 --verbose *.tar.gz

    - name: Fixup binary wheel
      run: auditwheel repair *.whl

    - name: Install binary wheel
      run: ${PYTHON} -m pip install wheelhouse/*.whl

    - name: Run post-installation tests
      run: |
        command -v ${PYTHON} && ${PYTHON} --version
        ${PYTHON} -m pip show xrootd
        ${PYTHON} -c 'import XRootD; print(XRootD)'
        ${PYTHON} -c 'import pyxrootd; print(pyxrootd)'
        ${PYTHON} -c 'from XRootD import client; help(client)'
        ${PYTHON} -c 'from XRootD import client; print(client.FileSystem("root://localhost"))'

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-${{ matrix.version }}-linux-${{ matrix.platform.arch }}
        path: wheelhouse
        retention-days: 14

  macos:
    name: Python ${{ matrix.version }} (macOS, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runs_on }}
    needs: [ sdist ]

    permissions:
      contents: none

    strategy:
      fail-fast: false
      matrix:
        version: [ "3.9", "3.10", "3.11", "3.12", "3.13", "3.14" ]
        platform:
          - arch: arm64
            runs_on: macos-15
            host_platform: macosx-15.0-arm64
            openssl_prefix: /opt/homebrew/opt/openssl@3
          - arch: x86_64
            runs_on: macos-15-intel
            host_platform: macosx-15.0-x86_64
            openssl_prefix: /usr/local/opt/openssl@3

    env:
      CMAKE_ARGS: -DPython_FIND_UNVERSIONED_NAMES=FIRST -DCMAKE_BUILD_TYPE=Release
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CMAKE_PREFIX_PATH: ${{ matrix.platform.openssl_prefix }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      _PYTHON_HOST_PLATFORM: ${{ matrix.platform.host_platform }}

    steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.version }}

    - name: Install dependencies with Homebrew
      run: brew install nlohmann-json

    - name: Install Python build dependencies
      run: python -m pip install build delocate

    - name: Download source distribution
      uses: actions/download-artifact@v7
      with:
        name: python-sdist

    - name: Build binary wheel
      run: python -m pip wheel --use-pep517 --verbose *.tar.gz

    - name: Fixup binary wheel
      run: delocate-wheel --no-sanitize-rpaths -w wheelhouse -v *.whl

    - name: Install binary wheel
      run: python -m pip install wheelhouse/*.whl

    - name: Run post-installation tests
      run: |
        command -v python && python --version
        python -m pip show xrootd
        python -c 'import XRootD; print(XRootD)'
        python -c 'import pyxrootd; print(pyxrootd)'
        python -c 'from XRootD import client; help(client)'
        python -c 'from XRootD import client; print(client.FileSystem("root://localhost"))'

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-${{ matrix.version }}-macos-${{ matrix.platform.arch }}
        path: wheelhouse
        retention-days: 14

  pypi:
    if: ${{ github.event_name == 'release' && github.repository_owner == 'xrootd' }}
    name: Publish to PyPI
    needs: [ macos, manylinux ]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v7
      with:
        path: dist
        pattern: python-*
        merge-multiple: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
