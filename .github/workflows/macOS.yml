name: macOS

on:
  push:
    branches:
      - macos
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CDASH: ${{ vars.CDASH }}
  CMAKE_VERBOSE_MAKEFILE: true
  CTEST_OUTPUT_ON_FAILURE: true

jobs:
  macos:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runs_on }}

    permissions:
      contents: read

    strategy:
      matrix:
        platform:
          - name: macOS 26 (x86_64)
            runs_on: macos-26-intel
            openssl_prefix: /usr/local/opt/openssl@4
          - name: macOS 26 (arm64)
            runs_on: macos-26
            openssl_prefix: /opt/homebrew/opt/openssl@3
          - name: macOS 27 (arm64)
            runs_on: xcode-27
            openssl_prefix: /opt/homebrew/opt/openssl@3
      fail-fast: false

    env:
      CC: clang
      CXX: clang++
      CMAKE_ARGS: "-DPython_FIND_UNVERSIONED_NAMES=FIRST"
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CMAKE_PREFIX_PATH: ${{ matrix.platform.openssl_prefix }}
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
    - name: Install dependencies with Homebrew
      run: brew install googletest libzip nlohmann-json python-setuptools

    - name: Install Python dependencies with pip
      run: python3 -m pip install --user --break-system-packages pytest

    - name: Clone repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build and Test with CTest
      run: ctest -VV -S test.cmake

    - name: Install with CMake
      run: sudo cmake --install build

    - name: Run post-install tests
      run: |
        export PYVERSION=$(python3 --version | grep -o 3...)
        export PYTHONPATH=/usr/local/lib/python${PYVERSION}/site-packages
        tests/post-install.sh
